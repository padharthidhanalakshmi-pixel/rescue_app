name: citypulse
description: CityPulse - real-time urban problem reporting and management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  geolocator: '>=13.0.1 <15.0.0'
  geocoding: '>=3.0.0 <5.0.0'
  flutter_map: '>=7.0.2 <9.0.0'
  latlong2: ^0.9.1
  fl_chart: '>=0.69.0 <2.0.0'
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
