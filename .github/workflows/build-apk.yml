name: Build CityPulse APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.citypulse --project-name citypulse .
          rm -rf test

      - name: Add GPS, camera and internet permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$M"
          sed -i 's#android:label="citypulse"#android:label="CityPulse"#' "$M"
          echo "----- AndroidManifest.xml -----"
          cat "$M"

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Analyze code (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/CityPulse-v1.0.${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityPulse-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CityPulse v1.0.${{ github.run_number }}
          body: |
            CityPulse Android app, build ${{ github.run_number }}.

            Download the APK below and install it on your phone
            (allow "Install unknown apps" when Android asks).

            Demo logins:
            - Citizen: citizen@citypulse.com / citizen123
            - Officer: officer@citypulse.com / officer123
            - Admin:   admin@citypulse.com / admin123
          files: dist/*.apk
